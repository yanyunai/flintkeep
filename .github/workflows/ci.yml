name: ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 桌面端依赖只用于打包，CI 不需要 Electron 二进制（省 100+MB 与时间）
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: i18n 键一致性
        run: npm run i18n:check
      - name: 单元测试（vitest）
        run: npm test
      - name: HTTP 回归基线
        # 路由顺序即安全语义：拆分/重构后由 56 项断言兜底（自带独立端口与临时数据目录）
        run: npm run smoke:http